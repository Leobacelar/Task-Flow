name: teste-final
on:
  push:
    branches: [teste-final]
jobs:
  back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Testar main
        run: |
          set -o pipefail
          sh mvnw -B -q -DskipTests package
          nohup java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8080/auth/login -X POST && break; sleep 2; done
          sleep 8
          H='Content-Type: application/json'
          c() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          echo "::notice title=login ana (200)::$(c -X POST localhost:8080/auth/login -H "$H" -d '{"email":"ana@taskflow.com","senha":"123456"}')"
          echo "::notice title=senha errada (401)::$(c -X POST localhost:8080/auth/login -H "$H" -d '{"email":"ana@taskflow.com","senha":"x"}')"
          echo "::notice title=listar atividades (200)::$(c localhost:8080/api/atividades)"
          echo "::notice title=criar atividade::$(curl -s -X POST localhost:8080/api/atividades -H "$H" -d '{"titulo":"t","descricao":"d","status":"a-fazer"}')"
          echo "::notice title=h2console::$(curl -s -L -o /dev/null -w '%{http_code}' localhost:8080/h2-console)"
