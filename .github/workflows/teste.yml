name: teste-regras
on:
  push:
    branches: [teste-regras]
jobs:
  back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Testar
        run: |
          set -o pipefail
          sh mvnw -B -q -DskipTests package
          nohup java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8080/auth/login -X POST && break; sleep 2; done
          sleep 8
          H='Content-Type: application/json'
          c() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          echo "::notice title=cadastro novo::$(c -X POST localhost:8080/auth/cadastro -H "$H" -d '{"nome":"Teste Novo","email":"novo@x.com","senha":"abc"}')"
          echo "::notice title=cadastro repetido::$(c -X POST localhost:8080/auth/cadastro -H "$H" -d '{"nome":"Teste Novo","email":"novo@x.com","senha":"abc"}')"
          echo "::notice title=cadastro vazio::$(c -X POST localhost:8080/auth/cadastro -H "$H" -d '{"nome":"","email":"y@x.com","senha":"abc"}')"
          echo "::notice title=login do novo::$(c -X POST localhost:8080/auth/login -H "$H" -d '{"email":"novo@x.com","senha":"abc"}')"
          echo "::notice title=login ana::$(c -X POST localhost:8080/auth/login -H "$H" -d '{"email":"ana@taskflow.com","senha":"123456"}')"
          echo "::notice title=criar em andamento (esperado 400)::$(c -X POST localhost:8080/api/atividades -H "$H" -d '{"titulo":"t","descricao":"d","status":"Em-andamento"}')"
          echo "::notice title=criar a-fazer (esperado 201)::$(c -X POST localhost:8080/api/atividades -H "$H" -d '{"titulo":"t","descricao":"d","status":"a-fazer"}')"
          echo "::notice title=a-fazer para finalizado (esperado 400)::$(c -X PUT localhost:8080/api/atividades/1 -H "$H" -d '{"titulo":"t","descricao":"d","status":"finalizado"}')"
          echo "::notice title=a-fazer para andamento (esperado 200)::$(c -X PUT localhost:8080/api/atividades/1 -H "$H" -d '{"titulo":"t","descricao":"d","status":"Em-andamento"}')"
          echo "::notice title=andamento para finalizado (esperado 200)::$(c -X PUT localhost:8080/api/atividades/1 -H "$H" -d '{"titulo":"t","descricao":"d","status":"finalizado"}')"
          echo "::notice title=editar texto mantendo status (esperado 200)::$(c -X PUT localhost:8080/api/atividades/1 -H "$H" -d '{"titulo":"t2","descricao":"d","status":"finalizado"}')"
          echo "::notice title=estado final::$(curl -s localhost:8080/api/atividades)"
