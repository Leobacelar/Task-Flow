name: teste-zip-back
on:
  push:
    branches: [teste-zip-back]
jobs:
  back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar e subir
        run: |
          ls -la mvnw
          sh mvnw -B -q -DskipTests package
          nohup java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null localhost:8080/auth/login -X POST; then break; fi
            sleep 2
          done
          sleep 8
          H='Content-Type: application/json'
          for u in ana vinnicius saimon; do
            echo "::notice title=zip login $u::$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/auth/login -H "$H" -d "{\"email\":\"$u@taskflow.com\",\"senha\":\"123456\"}")"
          done
          echo "::notice title=zip senha errada::$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/auth/login -H "$H" -d '{"email":"ana@taskflow.com","senha":"x"}')"
          echo "::notice title=zip criar atividade::$(curl -s -w ' [%{http_code}]' -X POST localhost:8080/api/atividades -H "$H" -d '{"titulo":"t","descricao":"d","status":"a-fazer"}')"
          echo "::notice title=zip listar::$(curl -s localhost:8080/api/atividades)"
          echo "::notice title=zip h2console::$(curl -s -L -o /dev/null -w '%{http_code}' localhost:8080/h2-console)"
