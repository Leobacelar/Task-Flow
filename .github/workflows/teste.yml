name: teste-h2console
on:
  push:
    branches: [teste-h2console]
jobs:
  back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          set -o pipefail
          sh mvnw -B -q -DskipTests package
          nohup java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8080/auth/login -X POST && break; sleep 2; done
          sleep 8
          echo "::notice title=h2console (200)::$(curl -s -L -o /dev/null -w '%{http_code}' localhost:8080/h2-console)"
          echo "::notice title=login ana (200)::$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/auth/login -H 'Content-Type: application/json' -d '{"email":"ana@taskflow.com","senha":"123456"}')"
