<section class="login">

  <form class="login-caixa" (ngSubmit)="entrar()">

    <div class="login-logo">
      <span class="logo-icon">✓</span>
      <span>TaskFlow</span>
    </div>

    <h1>Entrar</h1>
    <p>Acesse o sistema de gestão de tarefas.</p>

    <label for="email">E-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="seu@email.com"
      [(ngModel)]="email">

    <label for="senha">Senha</label>
    <input
      id="senha"
      name="senha"
      type="password"
      placeholder="Sua senha"
      [(ngModel)]="senha">

    @if (erro !== '') {
      <span class="login-erro">{{ erro }}</span>
    }

    <button type="submit">Entrar</button>

  </form>

</section>
